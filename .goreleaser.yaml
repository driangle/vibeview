version: 2

project_name: vibeview

before:
  hooks:
    - make web
    - bash -c "rm -rf apps/cli/internal/spa/dist && cp -r apps/web/dist apps/cli/internal/spa/dist"

builds:
  - dir: apps/cli
    main: ./cmd/vibeview
    binary: vibeview
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.GitCommit={{.Commit}} -X main.BuildDate={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew publishing is handled by the "Update Homebrew Formula" step in
# .github/workflows/release.yml (a hand-rolled formula supporting macOS +
# Linux), not by GoReleaser. See that workflow for the formula template.
