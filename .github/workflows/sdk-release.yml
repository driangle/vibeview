# Releases the apps/lib Go module whenever it changes on main.
#
# apps/lib (github.com/driangle/vibeview/apps/lib) is consumed by tag: skival and
# anything else embedding sessionhtml runs `go get ...@vX.Y.Z`. Changes that sit
# on main untagged are invisible to them, and tagging by hand is the kind of step
# that gets forgotten right up until someone asks for a release.
#
# This job cuts the next version — patch by default, minor when a commit touching
# apps/lib says "sdk-bump: minor" — pushes the tag, and pushes back a commit
# repointing apps/cli/go.mod at it. See scripts/auto-release-sdk.sh.
#
# The push uses GITHUB_TOKEN, so it deliberately does NOT trigger another
# workflow run (GitHub suppresses that to prevent recursion).
name: SDK Release

on:
  push:
    branches: [main]
    paths:
      - "apps/lib/**"
  # Manual runs, for checking the release flow without landing an SDK change.
  # Defaults to a dry run: it reports the version it would cut and stops.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be released without tagging or pushing"
        type: boolean
        default: true

# Two pushes landing together must not both try to cut a version.
concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions:
  contents: write # to push the tag and the pin bump

jobs:
  release:
    name: Tag apps/lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, and the diff against the last one

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            apps/cli/go.sum
            apps/lib/go.sum

      - name: Release apps/lib if it has changed since its last tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/auto-release-sdk.sh ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Push the pin bump
        if: ${{ !inputs.dry_run }}
        run: |
          # No-op when the script made no commit. If main moved under us, rebase
          # the go.mod-only commit and retry once before failing.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Verify the released version resolves
        if: ${{ !inputs.dry_run }}
        run: ./scripts/verify-sdk-release.sh
