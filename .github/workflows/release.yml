name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/cli/go.sum

      - name: Create placeholder dist for embed
        run: mkdir -p internal/spa/dist && echo '<!doctype html>' > internal/spa/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/cli

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/cli/go.sum

      - name: Create placeholder dist for embed
        run: mkdir -p internal/spa/dist && echo '<!doctype html>' > internal/spa/dist/index.html

      - name: Build
        run: go build ./cmd/vibeview

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            apps/cli/go.sum
            apps/lib/go.sum

      - name: Create placeholder dist for embed
        run: mkdir -p internal/spa/dist && echo '<!doctype html>' > internal/spa/dist/index.html

      - name: Test
        run: |
          go test -race -cover ./...
          cd ../lib
          go test -race -cover ./...

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typeCheck

      - name: Build
        run: npm run build

  web-test:
    name: Web Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --if-present

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

  release:
    needs: [go-lint, go-build, go-test, web-lint, web-build, web-test, docs-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/cli/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # Extract SHA256 checksums from GoReleaser's checksums.txt (same runner)
          SHA256_DARWIN_ARM64=$(grep "vibeview_${VERSION}_darwin_arm64.tar.gz" dist/checksums.txt | awk '{print $1}')
          SHA256_DARWIN_AMD64=$(grep "vibeview_${VERSION}_darwin_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')
          SHA256_LINUX_AMD64=$(grep "vibeview_${VERSION}_linux_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')

          # Clone the homebrew-tap repository
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/driangle/homebrew-tap.git tap-repo
          cd tap-repo

          # Generate the formula file (macOS arm64/amd64 + Linux amd64)
          cat > Formula/vibeview.rb << 'EOF'
          class Vibeview < Formula
            desc "A local viewer for Claude Code sessions"
            homepage "https://github.com/driangle/vibeview"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/driangle/vibeview/releases/download/TAG_PLACEHOLDER/vibeview_VERSION_PLACEHOLDER_darwin_arm64.tar.gz"
                sha256 "SHA256_DARWIN_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/driangle/vibeview/releases/download/TAG_PLACEHOLDER/vibeview_VERSION_PLACEHOLDER_darwin_amd64.tar.gz"
                sha256 "SHA256_DARWIN_AMD64_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/driangle/vibeview/releases/download/TAG_PLACEHOLDER/vibeview_VERSION_PLACEHOLDER_linux_amd64.tar.gz"
                sha256 "SHA256_LINUX_AMD64_PLACEHOLDER"
              end
            end

            def install
              bin.install "vibeview"
            end

            test do
              system bin/"vibeview", "--version"
              assert_match version.to_s, shell_output("#{bin}/vibeview --version")
            end
          end
          EOF

          # Replace placeholders with actual values
          sed -i "s/TAG_PLACEHOLDER/${TAG}/g" Formula/vibeview.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/vibeview.rb
          sed -i "s/SHA256_DARWIN_ARM64_PLACEHOLDER/${SHA256_DARWIN_ARM64}/g" Formula/vibeview.rb
          sed -i "s/SHA256_DARWIN_AMD64_PLACEHOLDER/${SHA256_DARWIN_AMD64}/g" Formula/vibeview.rb
          sed -i "s/SHA256_LINUX_AMD64_PLACEHOLDER/${SHA256_LINUX_AMD64}/g" Formula/vibeview.rb

          # Install Homebrew on Linux for formula auditing
          if ! command -v brew &> /dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi

          # Link the cloned repo as a Homebrew tap so audit can find it by name
          BREW_TAP_DIR="$(brew --repository)/Library/Taps/driangle/homebrew-tap"
          mkdir -p "$(dirname "$BREW_TAP_DIR")"
          ln -sfn "$(pwd)" "$BREW_TAP_DIR"

          # Audit formula before pushing
          brew audit --strict --formula driangle/tap/vibeview

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push
          git add Formula/vibeview.rb
          git commit -m "Update vibeview formula to ${VERSION}

          Auto-generated by release workflow
          Release: https://github.com/driangle/vibeview/releases/tag/${TAG}"
          git push origin main
